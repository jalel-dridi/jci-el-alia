name: CI

# Build the site (and studio) on every push / PR so broken builds are caught
# before Cloudflare Pages deploys (the website build uses placeholder Sanity env
# -> seed fallback). The quality job checks the real site for broken links and
# accessibility problems, also weekly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so problems introduced through the dashboard (not code) show up too
  schedule:
    - cron: '0 6 * * 1' # Mondays 07:00 Tunis
  workflow_dispatch:

jobs:
  build-web:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:i18n
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: placeholder
          PUBLIC_SANITY_DATASET: production

  quality:
    name: Links and accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Real content from Sanity, so the check sees what visitors see
      - run: npm run build
        env:
          PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
          PUBLIC_SANITY_DATASET: production
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm run check:a11y

  build-studio:
    name: Build admin dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npx sanity build
        env:
          SANITY_STUDIO_PROJECT_ID: placeholder
          SANITY_STUDIO_DATASET: production
